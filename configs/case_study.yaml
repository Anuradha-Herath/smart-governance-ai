decision:
  id: "DEC_2023_ELEC_01"
  domain: "Electricity Tariffs & Energy Pricing"
  title: "Cost-Reflective Electricity Tariff Revision (February 2023)"
  country: "Sri Lanka"
  announcement_date: "2023-01-09"
  implementation_date: "2023-02-15"
  status: "Implemented"
  stated_objective: >
    Restore the financial viability of the Ceylon Electricity Board (CEB),
    eliminate untargeted state subsidies on electricity generation, and align
    domestic utility tariffs with cost-reflective pricing under the IMF Extended
    Fund Facility (EFF) framework.

